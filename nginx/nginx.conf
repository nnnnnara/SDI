events {}

http {
    server {
        listen 80;
        server_name k14a306.p.ssafy.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name k14a306.p.ssafy.io;

        ssl_certificate /etc/letsencrypt/live/k14a306.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/k14a306.p.ssafy.io/privkey.pem;

        location /api/ {
            proxy_pass http://backend:8080/;
        }

        location /camera-view-1/ {
            proxy_pass http://100.99.75.18:8001/camera-view-1/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /camera-view-2/ {
            proxy_pass http://100.99.75.18:8001/camera-view-2/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000/;
        }

        location / {
            proxy_pass http://frontend:80;
        }
    }
}
