image: gradle:8.7-jdk17

stages:
  - deploy

deploy:
  stage: deploy
  only:
    - develop

  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - apt-get update
    - apt-get install -y docker.io docker-compose-plugin

  script:
    # application.yml 생성
    - mkdir -p smart-factory/src/main/resources
    - |
      cat > smart-factory/src/main/resources/application.yml <<EOF
      spring:
        datasource:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://postgres:5432/smart_factory
          username: postgres
          password: ${POSTGRES_PASSWORD}

        jpa:
          open-in-view: false
          hibernate:
            ddl-auto: update
          properties:
            hibernate:
              jdbc:
                time_zone: Asia/Seoul
          show-sql: false

        jackson:
          time-zone: Asia/Seoul
          mapper:
            accept-case-insensitive-enums: true

      jwt:
        secret: ${JWT_SECRET}

      mqtt:
        broker-url: tcp://mqtt:1883
      EOF

    # env 파일 생성
    - echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" > .env
    - echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD" >> .env
    - echo "JWT_SECRET=$JWT_SECRET" >> .env

    # build
    - cd smart-factory
    - chmod +x gradlew
    - ./gradlew clean build -x test
    - cd ..

    # deploy
    - docker compose -f docker-compose.prod.yml down
    - docker compose -f docker-compose.prod.yml up -d --build
    - docker ps